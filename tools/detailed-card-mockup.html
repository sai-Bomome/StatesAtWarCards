<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW · Detailed card mockup</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/card-faces.css"><style>
body{display:block;height:auto;overflow:auto;background:#3dcaec;color:#253d48}main{max-width:1120px;margin:auto;padding:36px 30px 46px}header{margin-bottom:30px}header small{font:700 11px Arial;letter-spacing:3px}h1{font:800 26px Arial;margin:10px 0 0}.gallery{display:flex;justify-content:center;gap:32px}.saw-card{width:290px;height:440px;flex-shrink:0;border:7px solid #fff8e7;border-radius:21px;padding-top:18px;background:linear-gradient(145deg,#fffdf7 15%,#f4f1e5 60%,#e9ede8);box-shadow:0 4px 0 #174a5655,0 12px 20px #174a5625,inset 0 0 0 1px #ac9d7f;isolation:isolate}.saw-card:before{content:'';position:absolute;inset:7px;border:1px solid #a8afa1;border-radius:12px;pointer-events:none;z-index:-1;box-shadow:0 0 0 3px #ffffff70,inset 0 1px 4px #84785812}.saw-card:after{content:'';position:absolute;left:16px;right:16px;bottom:17px;top:17px;border-radius:9px;border-top:1px solid #ffffffcc;border-bottom:1px solid #ffffffcc;pointer-events:none;z-index:-1}.face-heading{min-height:63px;gap:12px;padding-right:13px}.face-category{width:46px;height:47px;border-radius:0 9px 15px 0;box-shadow:inset 0 1px 0 #ffffff50,0 2px 3px #1c3f4920;background:linear-gradient(135deg,color-mix(in srgb,var(--face-accent),white 14%),var(--face-accent));border-top:1px solid #ffffff77}.face-category .card-vector{width:27px;height:27px}.saw-card .face-title{font-size:26px;letter-spacing:.3px;line-height:1.05}.face-art{padding:10px 23px 20px}.face-medallion{width:133px;height:133px;background:linear-gradient(145deg,#ffffffaa,var(--face-tint));border:2px solid #fffdf5;box-shadow:0 5px 10px #3e565220,inset 0 0 0 1px #a3afa522}.face-medallion>.card-vector{width:81px;height:81px;filter:drop-shadow(0 1px 0 #ffffffaa)}.face-modifier{right:-23px;bottom:-2px;min-width:62px;padding:5px 9px;border-radius:9px;font-size:34px;box-shadow:0 3px 5px #2a47451c;background:linear-gradient(#fffdf7,#f6f0df)}.face-description{min-height:111px;margin:0 17px 18px;padding:14px 12px;font-size:15px;line-height:1.4;border:1px solid #c1b294;border-radius:10px;background:linear-gradient(135deg,#fffdf6,#f6f1e7);box-shadow:0 0 0 3px #fffaf0,0 4px 8px #66574416,inset 0 1px 3px #a5967510}.fine-note{font:12px Arial;text-align:center;margin:28px 0 0;color:#245263}@media(max-width:950px){.gallery{flex-wrap:wrap}.saw-card{width:260px;height:405px}.saw-card .face-title{font-size:23px}}

/* Revision: centered name, original corner treatment and diamond divider. */
.face-heading{display:block;min-height:103px;padding:48px 10px 0;position:static}
.face-category{position:absolute;top:0;left:0;width:58px;height:42px;padding:5px 15px 6px 9px;border-radius:5px 0 24px 0;background:var(--face-accent);box-shadow:0 2px 3px #19374722;border-top:0}
.face-category .card-vector{width:26px;height:26px}
.saw-card{padding-top:0}

.face-divider{position:relative;display:block;flex:0 0 1px;height:1px;width:70%;margin:0 auto 2px;background:var(--face-accent);opacity:.45}
.face-divider:after{content:'';position:absolute;left:calc(50% - 4px);top:-4px;width:8px;height:8px;background:var(--face-accent);transform:rotate(45deg);box-shadow:0 0 0 5px #f7f5ec}
.face-art{padding:9px 23px 15px}.face-medallion{width:117px;height:117px}.face-medallion>.card-vector{width:73px;height:73px}

/* Larger, more readable content within the same card footprint. */
.face-heading{min-height:96px;padding:46px 8px 0}

</style><main><header><small>STATES AT WAR · CARD MOCKUP</small><h1>Centered titles. Clear requirements.</h1></header><section class="gallery" aria-label="Detailed card mockups"></section><p class="fine-note">Original corner badge & diamond divider · requirements highlighted separately</p></main><script type="module">import {cardFace,cardCategory} from '/card-icons.js';import {CARDS,cardDescription} from '/game.js';document.querySelector('.gallery').innerHTML=['reinforce5','monument','capture'].map(type=>`<article class="saw-card category-${cardCategory(type)}" aria-label="${CARDS[type].name}">${cardFace(type,cardDescription(type),CARDS[type].value).replace('<span class="face-art">','<span class="face-divider" aria-hidden="true"></span><span class="face-art">')}</article>`).join('');
const copy={reinforce5:['Owned province','Add 5 active troops.'],monument:['Requires 5 active troops','Troops are not spent.<br>Control 3 monuments to win.'],capture:['Requires a besieged enemy province','Fight the active defenders.<br>Capture and keep its building.']};
document.querySelectorAll('.gallery article').forEach((el,i)=>{const [requirement,effect]=copy[['reinforce5','monument','capture'][i]];el.querySelector('.face-description').innerHTML=`<strong class="face-requirement">${requirement}</strong><span class="face-effect">${effect}</span>`;});</script></html>
