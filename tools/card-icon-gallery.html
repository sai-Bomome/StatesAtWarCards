<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW · Card icon set</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/card-faces.css"><style>body{background:#3dcaec;overflow:auto;height:auto;display:block;color:#253d48}main{max-width:1250px;margin:0 auto;padding:35px 25px}h1{font:800 30px Arial;margin:0 0 8px}p{font:14px Arial}.gallery{display:grid;grid-template-columns:repeat(auto-fit,150px);justify-content:center;gap:18px;margin-top:28px}.saw-card{height:230px;width:150px;border:3px solid #fffdf5;border-radius:12px;padding-top:8px;box-shadow:0 4px 9px #173c4c22}.face-title{font-size:14px}.face-description{font-size:11px;min-height:70px}.face-medallion{width:70px;height:70px}.face-medallion>.card-vector{width:46px;height:46px}.face-category{width:30px;height:32px}.face-modifier{font-size:23px}</style><main><h1>States at War · Card icons</h1><p>Blue / Reinforcements &nbsp; Green / Buildings &nbsp; Red / Attack</p><section class="gallery" aria-label="All card designs"></section></main><script type="module">import {cardFace,cardCategory,cardIcon} from '/card-icons.js';import {CARDS,cardDescription} from '/game.js';document.querySelector('.gallery').innerHTML=Object.entries(CARDS).map(([type,c])=>`<article class="saw-card category-${cardCategory(type)}" aria-label="${c.name}">${cardFace(type,cardDescription(type),c.value)}</article>`).join('')+`<article class="saw-card category-reinforcement" aria-label="Move Troops icon preview"><span class="face-heading"><span class="face-category">${cardIcon('helmet')}</span><span class="face-title">MOVE TROOPS</span></span><span class="face-art"><span class="face-medallion">${cardIcon('move-troops')}</span></span><span class="face-description">Movement icon preview.</span></article>`;</script></html>
