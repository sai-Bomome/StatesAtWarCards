<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW · Match results</title><link rel="stylesheet" href="/style.css"><style>body{height:auto;display:block;background:#3dcaec}.examples{padding:35px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px}.card-frame{position:relative;min-height:630px;border:1px solid #ffffff66;border-radius:18px;background:#3dcaec}.preview-label{text-align:center;font-size:14px;color:#153b48;margin:20px;font-weight:800}.card-frame>.match-result{width:calc(100% - 28px)}.preview-map{position:absolute;left:8%;top:60px;width:84%;height:280px}.match-result h1{font-size:60px}</style><main class="examples"></main><script type="module">import {matchResult} from '/match-result.js';import {createGame} from '/game.js';import {createIslandGeometry} from '/island-map.js';const game=createGame(42),geo=createIslandGeometry(4,42,game.states);const board=color=>`<svg class="preview-map" viewBox="0 0 ${geo.width} ${geo.height}" aria-label="Final battlefield preview">${geo.cells.map((c,i)=>`<path d="${c.path}" fill="${i%3===0?'#e5ecd8':color}" stroke="#333" stroke-width="1"/>`).join('')}</svg>`;const base={winner:0,players:[{name:'Sai'},{name:'Field Bot'}],config:{monumentsToWin:3},winReason:'3 monuments'};document.querySelector('.examples').innerHTML=`<div class="card-frame"><p class="preview-label">Prosperity · player wins</p>${board('#5798e4')}${matchResult(base,0)}</div><div class="card-frame"><p class="preview-label">Annihilation · bot wins</p>${board('#ed7d7d')}${matchResult({...base,winner:1,winReason:'annihilation'},0)}</div>`;</script></html>
