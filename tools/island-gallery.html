<!doctype html><html lang="en"><meta charset="UTF-8"><title>Province growth variants</title><style>body{margin:0;background:#133642;color:#edf9f3;font:14px system-ui;padding:24px}h1{margin:0 0 6px}p{color:#acd0d4}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{border:1px solid #57919c;border-radius:12px;overflow:hidden;background:#29c3e4}h2{font-size:13px;padding:10px 14px;margin:0;background:#19424e}svg{width:100%;display:block}.province{fill:#ecf1dc;stroke:none}.border{stroke:#6c847c;stroke-width:1.8;fill:none}.coast{stroke:#fff9e8;stroke-width:2.5;fill:none}</style><h1>Province growth · fixed boundary</h1><p>Same island outline · random spaced seeds · individual growth speeds · shared borders</p><div class="gallery"></div><script type="module">
import {createIslandGeometry} from '../island-map.js';
const states=Array.from({length:16},(_,id)=>({id,active:true}));
for(const seed of [42,1337,7719,303,9182,44011]){const g=createIslandGeometry(4,seed,states);document.querySelector('.gallery').insertAdjacentHTML('beforeend',`<article><h2>Seed ${seed}</h2><svg viewBox="0 0 ${g.width} ${g.height}">${g.cells.map(c=>`<path class="province" d="${c.path}"/>`).join('')}${g.borders.map(e=>`<path class="border" d="${e.path}"/>`).join('')}${g.coast.map(e=>`<path class="coast" d="${e.path}"/>`).join('')}</svg></article>`);}
</script></html>
